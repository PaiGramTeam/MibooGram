<div class="rounded-lg bg-black bg-opacity-20">
  {% for prop in character.properties %}
  <div
    class="px-7 py-1.5 flex justify-between items-center even:bg-white even:bg-opacity-10"
  >
    <div>{{ prop.property_name }}</div>
    <div class="flex items-center space-x-2">
      {% if prop.add != '' %}
      <span class="rounded px-1.5 py-0.5 text-sm italic">
        {{ prop.base }}<span class="text-green-400">+{{ prop.add }}</span>
      </span>
      {% endif %}
      <span class="italic">{{ prop.final }}</span>
    </div>
  </div>
  {% endfor %}
</div>
